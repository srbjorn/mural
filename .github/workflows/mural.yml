name: Mural

# Ordem: barrinha do PC (Windows) → app Android + release com os dois arquivos → site com versao.json.
# O versao.json só sai depois que a release existe, para o aviso de atualização nunca apontar para um arquivo que ainda não está lá.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mural
  cancel-in-progress: true

jobs:
  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar a barrinha da barra de tarefas
        shell: powershell
        run: |
          ./tools/compilar-barra.ps1
          if (-not (Test-Path pc/MuralBarra.exe)) { exit 1 }
          Compress-Archive -Path pc/INSTALAR.bat, pc/instalar.ps1, pc/mural.ico, pc/MuralBarra.exe -DestinationPath mural-pc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mural-pc
          path: mural-pc.zip

  apk:
    needs: pc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Endereço do site e chave de assinatura
        env:
          KS: ${{ secrets.MURAL_KEYSTORE_B64 }}
        run: |
          dono=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "MURAL_SITE=https://$dono.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/mural.p12"
            echo "MURAL_KEYSTORE=$RUNNER_TEMP/mural.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem MURAL_KEYSTORE_B64: o APK sai com chave temporária e não atualiza por cima da versão anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          MURAL_KEYSTORE_SENHA: ${{ secrets.MURAL_KEYSTORE_SENHA }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk mural.apk

      - uses: actions/download-artifact@v4
        with:
          name: mural-pc

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mural 1.0.${{ github.run_number }}
          body: |
            mural.apk: app do celular (instale por cima; as anotações não se perdem).
            mural-pc.zip: instalador do PC (extraia e dê dois cliques em INSTALAR.bat).
          files: |
            mural.apk
            mural-pc.zip
          make_latest: true

  site:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Escrever versao.json
        run: |
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          app=$(tr -d '[:space:]' < android/versao.txt)
          pc=$(tr -d '[:space:]' < pc/barra/versao.txt)
          printf '{"site": %s, "app": %s, "pc": %s, "apk": "%s/mural.apk", "pcZip": "%s/mural-pc.zip"}\n' \
            "${{ github.run_number }}" "$app" "$pc" "$base" "$base" > web/versao.json
          cat web/versao.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
