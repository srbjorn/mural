name: Mural

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mural
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Endereço do site e chave de assinatura
        env:
          KS: ${{ secrets.MURAL_KEYSTORE_B64 }}
        run: |
          dono=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "MURAL_SITE=https://$dono.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/mural.p12"
            echo "MURAL_KEYSTORE=$RUNNER_TEMP/mural.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem MURAL_KEYSTORE_B64: o APK sai com chave temporária e não atualiza por cima da versão anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          MURAL_KEYSTORE_SENHA: ${{ secrets.MURAL_KEYSTORE_SENHA }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk mural.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mural 1.0.${{ github.run_number }}
          body: Baixe o mural.apk no celular e instale (ele atualiza por cima da versão anterior).
          files: mural.apk
          make_latest: true
